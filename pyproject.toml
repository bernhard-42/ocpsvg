
[project]
name = "ocpsvg"
readme = "readme-pypi.md"
version = "0.7.0+nanocct"
requires-python = ">=3.11"
dependencies = [
    "svgelements >= 1.9.1, <2",
]


[project.optional-dependencies]
# development and tests on one binding each: .[ocp] or .[nanocct]
ocp = [
    "cadquery_ocp_novtk >= 8.0, < 9.0",
    "cadquery-ocp-stubs >= 8.0, < 9.0",
    "pytest",
    "coverage",
    "mypy",
    "ruff",
]
nanocct = [
    "nanocct >= 8.0, < 9.0",
    "pytest",
    "coverage",
    "mypy",
    "ruff",
]

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# re-exports the OCCT names of the chosen binding
"ocpsvg/_occt.py" = ["F401"]

[tool.coverage.report]
exclude_also = [
    "\\s+\\.\\.\\.",
]
